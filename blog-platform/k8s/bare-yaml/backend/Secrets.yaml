apiVersion: v1 # Kubernetes API version for core resources
kind: Secret # Declares this resource as a Secret
metadata:
  name: postgres-secret # Name of the Secret (used to reference later)
type: Opaque # Generic secret type (key-value pairs)
stringData: # Allows plain text values (Kubernetes encodes to base64 automatically)
  host: postgres-service # Database host (usually the Service name)
  port: "5432" # Database port
  database: mydb # Database name
  username: myuser # Database username
  password: mypassword # Database password
